services:
  gadm-downloader:
    build: .
    image: gadm-downloader:latest
    container_name: gadm-downloader
    restart: "no"
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=gadm
      - DB_USER=gadm_user
      - DB_PASSWORD=gadm_password